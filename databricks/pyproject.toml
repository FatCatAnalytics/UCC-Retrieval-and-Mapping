[project]
name = "ucc_pipeline"
version = "0.1.0"
description = "UCC Retrieval & Mapping pipeline — Databricks port of the Dagster assets"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "rapidfuzz",
    "sentence-transformers",
    "faiss-cpu",
]

[project.scripts]
ucc-run-pipeline = "ucc_pipeline.run_pipeline:main"
ucc-run-stage = "ucc_pipeline.run_stage:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
