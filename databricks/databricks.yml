# Databricks Asset Bundle for the UCC Retrieval & Mapping pipeline.
#
# Deploy:   databricks bundle deploy  -t dev
# Run:      databricks bundle run ucc_mapping_pipeline_single -t dev
#           databricks bundle run ucc_mapping_pipeline_staged -t dev
#
# The bundle builds the ucc_pipeline wheel from ./pyproject.toml and ships it to
# the job clusters. Two jobs are defined:
#   * ucc_mapping_pipeline_single  — one task runs the whole DAG in-process
#                                    (recommended; no intermediate serialization).
#   * ucc_mapping_pipeline_staged  — 17 tasks, one per Dagster asset, wired with
#                                    depends_on to reproduce the asset DAG.
#
# Embeddings: by default the pipeline calls a Databricks Foundation Model API
# serving endpoint (config.embedding_endpoint, default databricks-bge-large-en-v1.5)
# via mlflow.deployments. The workspace must have that Foundation Model API enabled
# (pay-per-token) and the job's run identity must be permitted to query it. The
# deploy client authenticates from the cluster context automatically — no token
# config needed. To run without it, pass --conf embedding_backend=local. See README.
bundle:
  name: ucc_mapping_pipeline

artifacts:
  ucc_pipeline_wheel:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for published result tables.
    default: main
  schema:
    description: Unity Catalog schema for published result tables.
    default: ucc
  data_root:
    description: UC Volume root holding Inputs/ and Outputs/.
    default: /Volumes/main/ucc/data
  node_type_id:
    description: Worker/driver node type (cloud-specific — override per workspace).
    default: i3.xlarge
  spark_version:
    description: Databricks Runtime ML version (ships pandas/numpy/pyspark).
    default: 15.4.x-cpu-ml-scala2.12

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://your-workspace.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com

resources:
  jobs:
    # ----------------------------------------------------------------------
    # Recommended: single task runs the full pipeline in one process.
    # ----------------------------------------------------------------------
    ucc_mapping_pipeline_single:
      name: UCC Mapping Pipeline (single task)
      job_clusters:
        - job_cluster_key: ucc_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
            spark_env_vars:
              UCC_DATA_ROOT: ${var.data_root}
              UCC_CATALOG: ${var.catalog}
              UCC_SCHEMA: ${var.schema}
              UCC_STAGE_DIR: ${var.data_root}/_staging
      tasks:
        - task_key: run_pipeline
          job_cluster_key: ucc_cluster
          python_wheel_task:
            package_name: ucc_pipeline
            entry_point: ucc-run-pipeline
            parameters:
              - --conf
              - ucc_file=${var.data_root}/Inputs/raw.csv
              - --conf
              - master_file=${var.data_root}/Inputs/master_list.csv
              - --conf
              - universe_file=${var.data_root}/Inputs/tracked_banks.csv
              - --conf
              - output_dir=${var.data_root}/Outputs
          libraries:
            - whl: ./dist/*.whl
            # mlflow + databricks-sdk back the Foundation Model API embedding
            # client (embedding_backend=databricks). Databricks Runtime ML
            # already ships mlflow; pinned here for non-ML runtimes.
            - pypi: {package: mlflow>=2.9}
            - pypi: {package: databricks-sdk>=0.20}
            - pypi: {package: rapidfuzz>=3.0}
            - pypi: {package: faiss-cpu>=1.7}
            # Only needed for embedding_backend=local / local cross-encoder.
            - pypi: {package: sentence-transformers>=2.2}

    # ----------------------------------------------------------------------
    # Alternative: one task per asset, wired to reproduce the Dagster DAG.
    # Intermediates are exchanged via the staging volume (UCC_STAGE_DIR).
    # ----------------------------------------------------------------------
    ucc_mapping_pipeline_staged:
      name: UCC Mapping Pipeline (staged DAG)
      job_clusters:
        - job_cluster_key: ucc_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
            spark_env_vars:
              UCC_DATA_ROOT: ${var.data_root}
              UCC_CATALOG: ${var.catalog}
              UCC_SCHEMA: ${var.schema}
              UCC_STAGE_DIR: ${var.data_root}/_staging
      tasks:
        - task_key: ucc_raw_data
          job_cluster_key: ucc_cluster
          python_wheel_task: &stage_task
            package_name: ucc_pipeline
            entry_point: ucc-run-stage
            parameters:
              - --stage
              - ucc_raw_data
              - --conf
              - ucc_file=${var.data_root}/Inputs/raw.csv
              - --conf
              - master_file=${var.data_root}/Inputs/master_list.csv
              - --conf
              - universe_file=${var.data_root}/Inputs/tracked_banks.csv
              - --conf
              - output_dir=${var.data_root}/Outputs
          libraries: &stage_libs
            # See single-task job above: mlflow/databricks-sdk back the
            # Foundation Model API embedding client.
            - whl: ./dist/*.whl
            - pypi: {package: mlflow>=2.9}
            - pypi: {package: databricks-sdk>=0.20}
            - pypi: {package: rapidfuzz>=3.0}
            - pypi: {package: faiss-cpu>=1.7}
            - pypi: {package: sentence-transformers>=2.2}

        - task_key: master_mapping_data
          job_cluster_key: ucc_cluster
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, master_mapping_data, --conf, "master_file=${var.data_root}/Inputs/master_list.csv"]
          libraries: *stage_libs

        - task_key: normalized_master_data
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: master_mapping_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, normalized_master_data]
          libraries: *stage_libs

        - task_key: our_universe_data
          job_cluster_key: ucc_cluster
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, our_universe_data, --conf, "universe_file=${var.data_root}/Inputs/tracked_banks.csv"]
          libraries: *stage_libs

        - task_key: master_embeddings_cache
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: normalized_master_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, master_embeddings_cache]
          libraries: *stage_libs

        - task_key: exact_match_raw_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: ucc_raw_data}, {task_key: normalized_master_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, exact_match_raw_results]
          libraries: *stage_libs

        - task_key: exact_match_normalized_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: exact_match_raw_results}, {task_key: normalized_master_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, exact_match_normalized_results]
          libraries: *stage_libs

        - task_key: fuzzy_match_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: exact_match_normalized_results}, {task_key: normalized_master_data}, {task_key: master_embeddings_cache}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, fuzzy_match_results]
          libraries: *stage_libs

        - task_key: advanced_embedding_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: fuzzy_match_results}, {task_key: normalized_master_data}, {task_key: master_embeddings_cache}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, advanced_embedding_results]
          libraries: *stage_libs

        - task_key: clustered_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: advanced_embedding_results}, {task_key: master_embeddings_cache}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, clustered_results]
          libraries: *stage_libs

        - task_key: merged_cluster_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: clustered_results}, {task_key: master_embeddings_cache}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, merged_cluster_results]
          libraries: *stage_libs

        - task_key: suggested_mapping_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: merged_cluster_results}, {task_key: normalized_master_data}, {task_key: master_embeddings_cache}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, suggested_mapping_results]
          libraries: *stage_libs

        - task_key: universe_enriched_results
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: suggested_mapping_results}, {task_key: our_universe_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, universe_enriched_results]
          libraries: *stage_libs

        - task_key: updated_master_data
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: master_mapping_data}, {task_key: universe_enriched_results}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, updated_master_data]
          libraries: *stage_libs

        - task_key: merged_raw_with_firm_id
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: updated_master_data}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, merged_raw_with_firm_id, --conf, "ucc_file=${var.data_root}/Inputs/raw.csv"]
          libraries: *stage_libs

        - task_key: lead_bank_designation
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: universe_enriched_results}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, lead_bank_designation]
          libraries: *stage_libs

        - task_key: pipeline_outputs
          job_cluster_key: ucc_cluster
          depends_on: [{task_key: universe_enriched_results}]
          python_wheel_task:
            <<: *stage_task
            parameters: [--stage, pipeline_outputs, --conf, "output_dir=${var.data_root}/Outputs"]
          libraries: *stage_libs
