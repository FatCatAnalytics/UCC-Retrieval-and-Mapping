[project]
name = "ucc_mapping_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<=3.14"
dependencies = [
    "dagster",
    "dagster-cloud",
    "pandas",
    "numpy",
    "rapidfuzz",
    "sentence-transformers",
    "faiss-cpu",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "ucc_mapping_project.definitions"
code_location_name = "ucc_mapping_project"

[tool.setuptools.packages.find]
exclude=["ucc_mapping_project_tests"]
